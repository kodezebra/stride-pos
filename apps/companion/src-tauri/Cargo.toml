[package]
name = "companion"
version = "0.1.6"
description = "Stride Companion - offline backup till"
authors = ["Stride"]
edition = "2024"
rust-version = "1.95"

# This app owns its own lockfile and build. It is deliberately detached from the
# POS workspace so everything stays under apps/companion.
[workspace]

[lib]
name = "companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
directories = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }

# Shared plumbing, pinned to the same snapshot the desktop uses.
storage = { git = "https://github.com/kodezebra/stride-libs", rev = "850679a724d319db72e832155f72fd59aa957792" }
lan-http = { git = "https://github.com/kodezebra/stride-libs", rev = "850679a724d319db72e832155f72fd59aa957792" }

# Camera decoding is mobile-only; desktop builds keep the keyboard-wedge path.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
