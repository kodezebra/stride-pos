# Stride POS workspace root.
#
# A virtual manifest: the app lives in apps/desktop. crates/ is reserved for
# product-internal crates later. Shared plumbing comes from stride-libs at a
# pinned revision — never a tag, never a branch.

[workspace]
resolver = "3"
# `crates/*` joins this list when the first product-internal crate lands; Cargo
# errors on a glob that matches nothing, so the directory stays empty for now.
members = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
# ---- shared crates -------------------------------------------------------
# Pinned to one exact stride-libs commit. Move every line together; see
# stride-libs/AGENTS.md, "How a shared change reaches the products".
ui-kit = { git = "https://github.com/kodezebra/stride-libs", rev = "c53ee9d5270407f0525d3105e38ebc1f682be139" }
ui-shell = { git = "https://github.com/kodezebra/stride-libs", rev = "c53ee9d5270407f0525d3105e38ebc1f682be139" }
storage = { git = "https://github.com/kodezebra/stride-libs", rev = "c53ee9d5270407f0525d3105e38ebc1f682be139" }
config = { git = "https://github.com/kodezebra/stride-libs", rev = "c53ee9d5270407f0525d3105e38ebc1f682be139" }
app-boot = { git = "https://github.com/kodezebra/stride-libs", rev = "c53ee9d5270407f0525d3105e38ebc1f682be139" }
money = { git = "https://github.com/kodezebra/stride-libs", rev = "c53ee9d5270407f0525d3105e38ebc1f682be139" }

# ---- third-party ---------------------------------------------------------
# Versions are pinned to what is already cached in ~/.cargo/registry, so a
# clean build here needs no network. See docs/architecture.md ("Dependencies
# and offline builds") before bumping any of these.
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
directories = "6.0.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
# Password hashing for staff credentials. Argon2id at the OWASP parameters;
# the PHC string it returns is what the database stores, so the parameters can
# move later without a migration.
argon2 = "0.5.3"
# Staff and (later) synced row ids. v7 is time-ordered, which keeps the index
# dense when the same table also receives rows from other tills.
uuid = { version = "1.29.0", features = ["v7"] }
# OS randomness for credential salts and the recovery code. Already in the tree
# through `uuid`; named here because `auth` uses it directly, and a salt from
# anywhere but the OS is not a salt.
getrandom = "0.3.4"
# The till's LAN barcode listener. `tiny_http` is deliberately small: one
# thread, a handful of JSON requests, no async runtime in a desktop app.
tiny_http = "0.12.0"
# Pairing codes are drawn as QR codes in Settings. The default features pull in
# image encoders this app never uses; the modules are all we need.
qrcode = { version = "0.14.1", default-features = false }
# `default-features = false` on purpose: eframe's defaults switched from glow to
# wgpu in 0.36, so relying on them would silently swap the rendering backend.
# `accesskit` is also left off: egui-winit 0.36 needs accesskit 0.24, which is
# not in the offline registry. Re-enable both together, with a deliberate fetch.
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui = "0.36.2"
# SVG rendering for icon sets; `egui-lucide` bakes icon paths as SVG.
egui_extras = { version = "0.36.2", features = ["svg"] }
egui-lucide = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release builds are for shipping a single binary per app, so favour size and
# runtime speed over compile time.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
