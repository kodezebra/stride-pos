name: Companion APK

# Debug-signed APK for device and Waydroid testing. Manual runs upload an
# artifact; pos-v* tag builds also attach the APK to the GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'pos-v*'

permissions:
  contents: write

concurrency:
  group: companion-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform, build tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Export Android paths
        run: |
          SDK="${ANDROID_HOME:-$HOME/Android/Sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: apps/companion
        run: bun install --frozen-lockfile

      - name: Generate Android project
        working-directory: apps/companion
        run: bun run tauri android init

      - name: Build APK
        working-directory: apps/companion
        run: bun run tauri android build --apk

      - name: Collect APK
        id: apk
        run: |
          ROOT=apps/companion/src-tauri/gen/android
          APK=$(find "$ROOT" -type f -name '*.apk' | grep -E 'universal.*debug|debug' | head -n 1 || true)
          if [ -z "$APK" ]; then
            APK=$(find "$ROOT" -type f -name '*.apk' | head -n 1 || true)
          fi
          test -n "$APK" || { echo "No APK produced by the build" >&2; exit 1; }
          echo "Found $APK"
          cp "$APK" stride-companion-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stride-companion-debug
          path: stride-companion-debug.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/pos-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Stride Companion ${{ github.ref_name }}
          files: stride-companion-debug.apk
          generate_release_notes: true
