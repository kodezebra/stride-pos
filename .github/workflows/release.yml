name: Release

on:
  push:
    tags:
      - 'pos-v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag ancestry
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME must point to a commit on main. Merge the release commit first."
            exit 1
          fi

  desktop-linux:
    name: Desktop package (Linux, glibc 2.35)
    needs: verify
    runs-on: ubuntu-24.04
    # The binary keeps the glibc of the machine that links it. Build on Ubuntu
    # 22.04 (glibc 2.35) so the packages load on Debian 12 and newer; a
    # `-latest` runner raises that floor silently and breaks older shops.
    # See DEVELOPMENT.md, "Release compatibility".
    container:
      image: ubuntu:22.04
    steps:
      # The image is bare, and checkout needs git.
      - name: Install git for checkout
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/install-linux-build-deps.sh

      # Distinct cache key: artifacts built against the runner's newer glibc
      # must never be reused here, or the check below would pass on a stale
      # binary.
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-glibc-2.35

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#pos-v}" >> "$GITHUB_OUTPUT"

      # Builds, packages deb/rpm/tar.gz, fails if anything needs glibc newer
      # than 2.35, and refuses a binary that cannot resolve its libraries.
      - name: Build, package and check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-linux-release.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    name: Desktop package (Windows)
    needs: verify
    runs-on: windows-2022
    env:
      # Static C runtime, so the till needs nothing installed on the shop PC.
      # Without this the exe wants vcruntime140.dll from the VC++ Redistributable,
      # which is not part of Windows. Set per job so the cache key sees it.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#pos-v}" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Build
        run: cargo build --release --locked -p desktop --target x86_64-pc-windows-msvc

      - name: Assert no VC++ runtime dependency
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/desktop.exe"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs "VC\Tools\MSVC") -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -like '*Hostx64\x64*' } |
            Select-Object -First 1 -ExpandProperty FullName
          & $dumpbin /nologo /dependents $exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $exe" }
          $bad = & $dumpbin /nologo /dependents $exe |
            Select-String -Pattern 'VCRUNTIME|MSVCP|ucrtbase|api-ms-win-crt'
          if ($bad) { throw "Binary still imports the VC++ runtime: $bad" }

      - name: Stage files for Windows installer
        run: |
          mkdir -p dist/windows
          cp "target/x86_64-pc-windows-msvc/release/desktop.exe" dist/windows/stride-pos.exe
          cp README.md dist/windows/README.md

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./apps/desktop/package-release.sh "target/x86_64-pc-windows-msvc/release/desktop.exe" "$VERSION" dist x86_64-pc-windows-msvc

      - name: Build Windows installer (Inno Setup)
        shell: cmd
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set "ISCC=%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe"
          if not exist "%ISCC%" set "ISCC=%ProgramFiles%\Inno Setup 6\ISCC.exe"
          if not exist "%ISCC%" set "ISCC=iscc"
          "%ISCC%" /DMyAppVersion=%VERSION% apps\desktop\windows\stride-pos.iss
          if errorlevel 1 exit /b 1
          if exist dist\windows rmdir /s /q dist\windows

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#pos-v}"
          core="${version%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          case "${major}${minor}${patch}" in
            *[!0-9]*) echo "::error::Tag version must be numeric (pos-vMAJOR.MINOR.PATCH)."; exit 1 ;;
          esac
          code=$((10#${major} * 10000 + 10#${minor} * 100 + 10#${patch}))
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.STRIDE_SCAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stride-scan.jks"
            echo "path=$RUNNER_TEMP/stride-scan.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: apps/scanner
        env:
          STRIDE_SCAN_VERSION: ${{ steps.version.outputs.version }}
          STRIDE_SCAN_VERSION_CODE: ${{ steps.version.outputs.code }}
          STRIDE_SCAN_KEYSTORE: ${{ steps.signing.outputs.path }}
          STRIDE_SCAN_STORE_PASSWORD: ${{ secrets.STRIDE_SCAN_STORE_PASSWORD }}
          STRIDE_SCAN_KEY_ALIAS: ${{ secrets.STRIDE_SCAN_KEY_ALIAS }}
          STRIDE_SCAN_KEY_PASSWORD: ${{ secrets.STRIDE_SCAN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify and collect APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          apk="$(find apps/scanner/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/stride-scan-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [desktop-linux, desktop-windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -eu
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: Stride POS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          append_body: |
            ## Phone scanner

            The Android companion is `stride-scan-*.apk`. Install it on a phone on
            the same Wi-Fi as the till, then open **Settings → Scanner** on the
            till, turn the listener on, and scan the pairing QR code with the app.

            ## Desktop

            - Linux: `stride-pos-*-linux.{tar.gz,deb,rpm}`
            - Windows: `stride-pos-*-windows.zip` and `stride-pos-*-windows-setup.exe`

            Verify all downloads against `SHA256SUMS.txt`.
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.zip
            dist/*.exe
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
