name: Release

on:
  push:
    tags:
      - 'pos-v*'

permissions:
  contents: write

jobs:
  verify:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag ancestry
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME must point to a commit on main. Merge the release commit first."
            exit 1
          fi

  rust:
    name: Desktop release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#pos-v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --locked -p pos

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          package="stride-pos-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${package}"
          cp target/release/pos "dist/${package}/stride-pos"
          cp README.md "dist/${package}/README.md"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"
          rm -rf "dist/${package}"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#pos-v}"
          core="${version%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          case "${major}${minor}${patch}" in
            *[!0-9]*) echo "::error::Tag version must be numeric (pos-vMAJOR.MINOR.PATCH)."; exit 1 ;;
          esac
          code=$((10#${major} * 10000 + 10#${minor} * 100 + 10#${patch}))
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.STRIDE_SCAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stride-scan.jks"
            echo "path=$RUNNER_TEMP/stride-scan.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: apps/scanner
        env:
          STRIDE_SCAN_VERSION: ${{ steps.version.outputs.version }}
          STRIDE_SCAN_VERSION_CODE: ${{ steps.version.outputs.code }}
          STRIDE_SCAN_KEYSTORE: ${{ steps.signing.outputs.path }}
          STRIDE_SCAN_STORE_PASSWORD: ${{ secrets.STRIDE_SCAN_STORE_PASSWORD }}
          STRIDE_SCAN_KEY_ALIAS: ${{ secrets.STRIDE_SCAN_KEY_ALIAS }}
          STRIDE_SCAN_KEY_PASSWORD: ${{ secrets.STRIDE_SCAN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify and collect APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          apk="$(find apps/scanner/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/stride-scan-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [rust, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -eu
          cd dist
          sha256sum *.tar.gz *.apk > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: Stride POS ${{ github.ref_name }}
          generate_release_notes: true
          append_body: |
            ## Phone scanner

            The Android companion is `stride-scan-*.apk`. Install it on a phone on
            the same Wi-Fi as the till, then open **Settings → Scanner** on the
            till, turn the listener on, and scan the pairing QR code with the app.

            The desktop build is the Linux x86_64 tarball. Verify both downloads
            against `SHA256SUMS.txt`.
          files: |
            dist/*.tar.gz
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
