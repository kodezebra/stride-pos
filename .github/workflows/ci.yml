name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  # Nothing else compiles the Windows-only choices: `ui-shell` swaps glow for
  # wgpu under `cfg(windows)`, and the release workflow only runs on a tag. A
  # tag is a poor place to find out the till no longer builds there.
  windows:
    name: Windows (build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Build
        run: cargo build --locked -p desktop

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: apps/scanner
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug

      # Gradle echoes only the first lint failure, so a red run hides every
      # other error behind "Lint found N errors ... First failure:". The text
      # report is written before the task aborts, so show all of it.
      - name: Lint report
        if: failure()
        working-directory: apps/scanner
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then
            cat "$report"
          else
            echo "No lint text report was produced."
            find app/build -name 'lint-results-*' -print 2>/dev/null || true
          fi

  # Proves the release path still produces a binary Debian 12 can load. The
  # main `rust` job runs on the runner's own (newer) glibc, so it cannot catch a
  # dependency that quietly raises the floor.
  linux-compat:
    name: Linux glibc floor (2.35)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    steps:
      - name: Install git for checkout
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/install-linux-build-deps.sh

      # Distinct cache key: artifacts compiled against the runner's newer glibc
      # must not leak into this job, or the floor check would pass on a stale
      # binary.
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-glibc-2.35

      - name: Build
        run: cargo build --locked -p desktop

      - name: Check glibc floor
        run: ./scripts/check-glibc-baseline.sh 2.35 target/debug/desktop
